<div
    class="card"
    [ngClass]="{
      'card--enrolled': enrolled$ | async,
      'card--full': course.credits >= 4,
      'passed-course': course.gradeStatus === 'passed',
      'failed-course': course.gradeStatus === 'failed',
      'pending-course': course.gradeStatus === 'pending',
      expanded: isExpanded
    }">

    <h2>{{ course.name }}</h2>

    <p>
        <strong>Code:</strong>
        {{ course.code }}
    </p>

    <p>
        <strong>Credits:</strong>
        {{ course.credits | creditLabel }}
    </p>

    <p>
        <strong>Status:</strong>
        <span
            [ngClass]="{
                'passed': course.gradeStatus === 'passed',
                'failed': course.gradeStatus === 'failed',
                'pending': course.gradeStatus === 'pending'
            }">
            {{ course.gradeStatus }}
        </span>
    </p>

    <div class="button-group">

        <button
            class="enroll-btn"
            (click)="toggleEnrollment()">

            {{ (enrolled$ | async)
                ? 'Unenroll'
                : 'Enroll' }}

        </button>

        <button
            class="details-btn"
            (click)="toggleDetails()">

            {{ isExpanded
                ? 'Hide Details'
                : 'Show Details' }}

        </button>

        <button
            class="students-btn"
            (click)="showStudents()">

            View Students

        </button>

    </div>

    <div *ngIf="isExpanded">

        <hr>

        <p>

            <strong>Course ID:</strong>

            {{ course.id }}

        </p>

        <p>

            <strong>Credits:</strong>

            {{ course.credits }}

        </p>

    </div>

</div>
