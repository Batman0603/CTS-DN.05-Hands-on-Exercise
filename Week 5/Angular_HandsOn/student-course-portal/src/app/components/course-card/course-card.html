<div
    class="card"
    [ngClass]="cardClasses"
    [ngStyle]="{
      'border-left':
      course.gradeStatus=='passed'
      ? '6px solid #22c55e'
      : course.gradeStatus=='failed'
      ? '6px solid #ef4444'
      : '6px solid #f59e0b'
    }">

    <h2>{{ course.name }}</h2>

    <p>

        <strong>Code:</strong>

        {{ course.code }}

    </p>

    <p>

        <strong>Credits:</strong>

        {{ course.credits | creditLabel }}

    </p>

    <div [ngSwitch]="course.gradeStatus">

        <span
            *ngSwitchCase="'passed'"
            class="passed">

            Passed

        </span>

        <span
            *ngSwitchCase="'failed'"
            class="failed">

            Failed

        </span>

        <span
            *ngSwitchCase="'pending'"
            class="pending">

            Pending

        </span>

    </div>

    <div class="card-actions">

        <button
            class="enroll-btn"
            (click)="toggleEnrollment()">

            {{ enrollmentService.isEnrolled(course.id)
                ? 'Unenroll'
                : 'Enroll' }}

        </button>

        <button
            class="details-btn"
            (click)="toggleDetails()">

            {{ isExpanded
                ? 'Hide Details'
                : 'Show Details' }}

        </button>

        <button
            class="students-btn"
            (click)="showStudents()">

            👥 View Students

        </button>

    </div>

    <div *ngIf="isExpanded">

        <hr>

        <p>

            <strong>Course ID:</strong>

            {{ course.id }}

        </p>

        <p>

            <strong>Credits:</strong>

            {{ course.credits }}

        </p>

    </div>

</div>
