<div class="page">

    <h1>Available Courses</h1>

    <div
        *ngIf="isLoading"
        class="loading-container">

        <div class="spinner"></div>

        <p>Loading Courses...</p>

    </div>

    <div
        *ngIf="errorMessage"
        class="error">

        {{ errorMessage }}

    </div>

    <div *ngIf="!isLoading">

        <div
            class="course-container"
            *ngFor="let course of courses; trackBy: trackByCourseId">

            <app-course-card
                [course]="course"
                (viewStudents)="loadStudents($event)">
            </app-course-card>

            <div
                *ngIf="selectedCourseId === course.id"
                class="students">

                <h2>

                    Students enrolled in

                    <span>{{ course.name }}</span>

                </h2>

                <div
                    *ngIf="loadingCourseId === course.id"
                    class="loading-container">

                    <div class="spinner"></div>

                    <p>Loading students...</p>

                </div>

                <div *ngIf="loadingCourseId !== course.id">

                    <p class="student-count">

                        Total Students:
                        <strong>{{ students.length }}</strong>

                    </p>

                    <ul *ngIf="students.length > 0">

                        <li *ngFor="let student of students">

                            {{ student.name }}

                        </li>

                    </ul>

                    <div
                        *ngIf="students.length === 0"
                        class="empty-state">

                        No students are enrolled in this course.

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
