<div class="page">

  <h1>Available Courses</h1>

  <!-- Loading -->

  <div
    *ngIf="loading$ | async"
    class="loading-container">

    <div class="spinner"></div>

    <p>Loading Courses...</p>

  </div>

  <!-- Error -->

  <div
    *ngIf="error$ | async as error"
    class="error">

    {{ error }}

  </div>

  <!-- Course List -->

  <ng-container *ngIf="!(loading$ | async)">

    <div
      class="course-container"
      *ngFor="let course of ((courses$ | async) ?? []); trackBy: trackByCourseId">

      <app-course-card
        [course]="course"
        (viewStudents)="loadStudents($event)">
      </app-course-card>

      <ng-container *ngIf="(selectedCourseId$ | async) as selectedCourseId">
        <div
          *ngIf="selectedCourseId === course.id"
          class="students-card">

          <h3>
            Students enrolled in {{ course.name }}
          </h3>

          <div *ngIf="studentsLoading$ | async; else studentList">
            <div class="loading-container">
              <div class="spinner"></div>
              <p>Loading students...</p>
            </div>
          </div>

          <ng-template #studentList>
            <ng-container *ngIf="(students$ | async) as students">
              <ul
                *ngIf="students.length > 0"
                class="students-list">

                <li
                  *ngFor="let student of students"
                  class="student-item">
                  {{ student.name }}
                </li>

              </ul>

              <p
                *ngIf="students.length === 0"
                class="no-students">
                No students found for this course.
              </p>
            </ng-container>
          </ng-template>

        </div>
      </ng-container>

    </div>

  </ng-container>

</div>
