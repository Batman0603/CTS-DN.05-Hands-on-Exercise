<div class="page">

  <h1>Available Courses</h1>

  <!-- Loading -->

  <div
    *ngIf="loading$ | async"
    class="loading-container">

    <div class="spinner"></div>

    <p>Loading Courses...</p>

  </div>

  <!-- Error -->

  <div
    *ngIf="error$ | async as error"
    class="error">

    {{ error }}

  </div>

  <!-- Course List -->

  <div *ngIf="!(loading$ | async)">

    <div
      class="course-container"
      *ngFor="let course of (courses$ | async); trackBy: trackByCourseId">

      <app-course-card
        [course]="course"
        (viewStudents)="loadStudents($event)">
      </app-course-card>

      <div *ngIf="selectedCourseId === course.id" class="students-card">

        <h3>Students enrolled in {{ course.name }}</h3>

        <ul class="students-list">

          <li *ngFor="let student of students" class="student-item">

            {{ student.name }}

          </li>

        </ul>

        <p *ngIf="students.length === 0" class="no-students">

          No students found for this course.

        </p>

      </div>

    </div>

  </div>

</div>
